name: Check Google Play access

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/play-access.yml
      - tools/check_play_access.mjs
      - tests/test_play_access.mjs
      - tools/publish_play_release.mjs
      - tests/test_play_publishing.mjs
      - release/android.json
      - release/upload-cert.sha256

permissions:
  contents: read

concurrency:
  group: rhenium-play-publishing
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test credential handling
        run: node --test tests/test_play_access.mjs tests/test_play_publishing.mjs
      - name: Authenticate and check app access
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node tools/check_play_access.mjs
      - name: Verify encrypted upload-key backup
        env:
          RHENIUM_UPLOAD_KEYSTORE_BASE64: ${{ secrets.RHENIUM_UPLOAD_KEYSTORE_BASE64 }}
          RHENIUM_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.RHENIUM_UPLOAD_KEYSTORE_PASSWORD }}
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix='rhenium-signing-') as directory:
              key = pathlib.Path(directory) / 'upload.p12'
              key.write_bytes(base64.b64decode(os.environ['RHENIUM_UPLOAD_KEYSTORE_BASE64'], validate=True))
              key.chmod(0o600)
              certificate = subprocess.check_output([
                  'keytool', '-exportcert', '-alias', 'rhenium-upload',
                  '-keystore', str(key), '-storepass:env', 'RHENIUM_UPLOAD_KEYSTORE_PASSWORD'])
              actual = hashlib.sha256(certificate).hexdigest()
              expected = pathlib.Path('release/upload-cert.sha256').read_text().strip()
              if actual != expected:
                  raise SystemExit('Upload-key backup does not match the pinned certificate')
              print('Upload-key backup matches the public certificate:', actual)
